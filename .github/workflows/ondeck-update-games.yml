name: Update OnDeck game data

on:
  schedule:
    # Daily at 13:07 UTC. That's ~5–6am Pacific depending on DST
    # (5am PST in winter, 6am PDT in summer). Off-round minute to be
    # polite to ESPN's API.
    - cron: '7 13 * * *'
  workflow_dispatch:                # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'ondeck/teams.json'
      - 'ondeck/scripts/**'
      - '.github/workflows/ondeck-update-games.yml'

permissions:
  contents: write

concurrency:
  group: update-games-ondeck
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./ondeck

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch schedules from ESPN
        run: node scripts/fetch-games.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          if git diff --staged --quiet; then
            echo "No changes — schedules unchanged since last run."
          else
            git commit -m "chore(ondeck): refresh game data [skip ci]"
            git push
          fi
